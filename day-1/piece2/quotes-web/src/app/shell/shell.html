<div class="app-shell">
  <header class="app-header">
    <nav>
      <a routerLink="/quotes" routerLinkActive="active">Quotes</a>
      <a routerLink="/browse" routerLinkActive="active">Browse</a>
      <a routerLink="/authors" routerLinkActive="active">Authors</a>
      <a routerLink="/signal-forms" routerLinkActive="active">Signal Forms</a>
    </nav>

    <div class="session">
      @if (auth.email()) {
        <span>{{ auth.email() }}</span>
      }
      <button type="button" (click)="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
